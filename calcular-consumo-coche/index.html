<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de consumo de coche</title><meta name="description" content="Calcula el consumo de tu coche en litros por 100 km."><style>
body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f5f5f5}.card{background:#fff;padding:25px;border-radius:14px;margin:15px 0}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:#075bd3}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 15px}button{padding:12px;background:#075bd3;color:white;border:0;border-radius:8px}
</style></head><body><div class="card"><nav><a href="../">Calculadora</a><a href="../calcular-coste-viaje/">Coste</a><a href="./">Consumo</a><a href="../coste-gasolina-por-km/">€/km</a><a href="../gasolina-vs-diesel/">Gasolina vs diésel</a><a href="../calculadora-coche-electrico/">Coche eléctrico</a></nav></div>
<div class="card"><h1>Calculadora de consumo de coche</h1><p>Introduce los kilómetros recorridos y los litros repostados.</p><label>Kilómetros recorridos<input id="km" type="number" min="0" step="0.1"></label><label>Litros consumidos<input id="liters" type="number" min="0" step="0.01"></label><button onclick="calc()">Calcular consumo</button><h2 id="r"></h2></div>
<script>function calc(){let k=+km.value,l=+liters.value;if(k>0&&l>=0)r.textContent='Consumo: '+(l/k*100).toFixed(2)+' L/100 km';else r.textContent='Introduce valores válidos.'}</script></body></html>
