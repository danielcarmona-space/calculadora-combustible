<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coste de gasolina por kilómetro</title><meta name="description" content="Calcula cuánto cuesta cada kilómetro en gasolina."><style>body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f5f5f5}.card{background:white;padding:25px;border-radius:14px;margin:15px 0}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:#075bd3}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 15px}button{padding:12px;background:#075bd3;color:white;border:0;border-radius:8px}</style></head><body><div class="card"><nav><a href="../">Calculadora</a><a href="../calcular-coste-viaje/">Coste</a><a href="../calcular-consumo-coche/">Consumo</a><a href="./">€/km</a><a href="../gasolina-vs-diesel/">Gasolina vs diésel</a><a href="../calculadora-coche-electrico/">Coche eléctrico</a></nav></div><div class="card"><h1>Coste de gasolina por kilómetro</h1><label>Consumo (L/100 km)<input id="c" type="number" min="0" step="0.1"></label><label>Precio gasolina (€/L)<input id="p" type="number" min="0" step="0.001"></label><button onclick="calc()">Calcular</button><h2 id="r"></h2></div><script>function calc(){let c=+document.getElementById('c').value,p=+document.getElementById('p').value;if(c>=0&&p>=0)document.getElementById('r').textContent='Coste: '+(c*p/100).toFixed(3)+' €/km';else document.getElementById('r').textContent='Introduce valores válidos.'}</script></body></html>
