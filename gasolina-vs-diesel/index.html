<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gasolina vs diésel: compara costes</title><meta name="description" content="Compara el coste por kilómetro de un coche de gasolina y uno diésel."><style>body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f5f5f5}.card{background:white;padding:25px;border-radius:14px;margin:15px 0}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:#075bd3}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 15px}button{padding:12px;background:#075bd3;color:white;border:0;border-radius:8px}</style></head><body><div class="card"><nav><a href="../">Calculadora</a><a href="../calcular-coste-viaje/">Coste</a><a href="../calcular-consumo-coche/">Consumo</a><a href="../coste-gasolina-por-km/">€/km</a><a href="./">Gasolina vs diésel</a><a href="../calculadora-coche-electrico/">Coche eléctrico</a></nav></div><div class="card"><h1>Gasolina vs diésel</h1><p>Compara el coste de combustible por kilómetro.</p><label>Gasolina: consumo L/100 km<input id="gc" type="number" step="0.1"></label><label>Gasolina: precio €/L<input id="gp" type="number" step="0.001"></label><label>Diésel: consumo L/100 km<input id="dc" type="number" step="0.1"></label><label>Diésel: precio €/L<input id="dp" type="number" step="0.001"></label><button onclick="calc()">Comparar</button><div id="r"></div></div><script>function calc(){let a=+gc.value*+gp.value/100,b=+dc.value*+dp.value/100;if([a,b].every(x=>x>=0))r.innerHTML='<p>Gasolina: <b>'+a.toFixed(3)+' €/km</b></p><p>Diésel: <b>'+b.toFixed(3)+' €/km</b></p>';else r.textContent='Introduce valores válidos.'}</script></body></html>
