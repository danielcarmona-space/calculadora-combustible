<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de combustible y coste de viaje</title>
<meta name="description" content="Calcula gratis el coste de un viaje en coche, consumo, gasolina, diésel y coste por kilómetro.">
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f5f5f5;color:#222}
.card{background:#fff;padding:25px;border-radius:14px;margin:15px 0;box-shadow:0 2px 10px #0001}
nav{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0} a{color:#075bd3;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:bold} input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#075bd3;color:white;font-weight:bold;cursor:pointer;margin-top:15px}
.result{font-size:1.1rem;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<h1>Calculadora de combustible</h1>
<p>Calcula cuánto cuesta un viaje en coche y cuánto gastas en combustible.</p>
<nav>
<a href="./">Inicio</a>
<a href="./calcular-coste-viaje/">Coste del viaje</a>
<a href="./calcular-consumo-coche/">Consumo</a>
<a href="./coste-gasolina-por-km/">€/km</a>
<a href="./gasolina-vs-diesel/">Gasolina vs diésel</a>
<a href="./calculadora-coche-electrico/">Coche eléctrico</a>
</nav>
</div>
<div class="card">
<h2>Calculadora rápida</h2>
<div class="grid">
<label>Distancia (km)<input id="distance" type="number" min="0" step="0.1"></label>
<label>Precio combustible (€/L)<input id="price" type="number" min="0" step="0.001"></label>
<label>Consumo (L/100 km)<input id="consumption" type="number" min="0" step="0.1"></label>
<label>Personas<input id="people" type="number" min="1" step="1" value="1"></label>
</div>
<button onclick="calculate()">Calcular</button>
<div id="result" class="result"></div>
</div>
<script>
function calculate(){
 const d=+document.getElementById('distance').value,p=+document.getElementById('price').value,
 c=+document.getElementById('consumption').value,n=+document.getElementById('people').value;
 if(!(d>=0&&p>=0&&c>=0&&n>=1)){document.getElementById('result').textContent='Introduce todos los datos.';return}
 const liters=d*c/100,total=liters*p;
 document.getElementById('result').innerHTML=`<b>Combustible:</b> ${liters.toFixed(2)} L<br><b>Coste total:</b> ${total.toFixed(2)} €<br><b>Coste por persona:</b> ${(total/n).toFixed(2)} €`;
}
</script>
</body></html>
