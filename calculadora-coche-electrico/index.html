<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de coste de coche eléctrico</title><meta name="description" content="Calcula el coste de electricidad por kilómetro y por viaje para un coche eléctrico."><style>body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f5f5f5}.card{background:white;padding:25px;border-radius:14px;margin:15px 0}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:#075bd3}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 15px}button{padding:12px;background:#075bd3;color:white;border:0;border-radius:8px}</style></head><body><div class="card"><nav><a href="../">Calculadora</a><a href="../calcular-coste-viaje/">Coste</a><a href="../calcular-consumo-coche/">Consumo</a><a href="../coste-gasolina-por-km/">€/km</a><a href="../gasolina-vs-diesel/">Gasolina vs diésel</a><a href="./">Coche eléctrico</a></nav></div><div class="card"><h1>Calculadora de coche eléctrico</h1><p>Calcula el coste de cargar y recorrer un viaje con un coche eléctrico.</p><label>Consumo (kWh/100 km)<input id="c" type="number" min="0" step="0.1"></label><label>Precio electricidad (€/kWh)<input id="p" type="number" min="0" step="0.001"></label><label>Distancia (km)<input id="d" type="number" min="0" step="0.1"></label><button onclick="calc()">Calcular</button><h2 id="r"></h2></div><script>function calc(){let c=+document.getElementById('c').value,p=+document.getElementById('p').value,d=+document.getElementById('d').value;if(c>=0&&p>=0&&d>=0)document.getElementById('r').innerHTML='Energía: '+(d*c/100).toFixed(2)+' kWh<br>Coste: '+(d*c*p/100).toFixed(2)+' €';else document.getElementById('r').textContent='Introduce valores válidos.'}</script></body></html>
